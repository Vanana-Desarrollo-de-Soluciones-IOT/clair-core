# Laptop profile: `SPRING_PROFILES_ACTIVE=local` (add `,demo` to seed five inventory devices).
#
# PostgreSQL, Redis and Mailpit come from ../docker-compose.local.yml. External integrations are
# given placeholder credentials so the application starts; each one fails closed:
#   - Google login: the placeholder client id never matches a real token audience -> login refused.
#   - Stripe: API calls fail -> no checkout; plans stay FREEMIUM and quotas keep applying.
#   - OneSignal: push delivery fails and is logged; nothing else changes.
# Email goes to Mailpit (http://localhost:8025), so sign-up verification codes are readable there.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clair_core}
    username: ${DB_USERNAME:clair}
    password: ${DB_PASSWORD:clair}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          ssl:
            enable: ${SMTP_SSL:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

SMTP_FROM: ${SMTP_FROM:clair@localhost}

jwt:
  secret: ${JWT_SECRET:local-development-secret-change-me-32chars-min}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:local-google-login-disabled}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:local-google-login-disabled}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:49220/api/v1/auth/google/callback}

frontend:
  url: ${FRONTEND_URL:http://localhost:4200}

stripe:
  api:
    key: ${STRIPE_PRIVATE_KEY:sk_test_local_disabled}
  public:
    key: ${STRIPE_PUBLIC_KEY:pk_test_local_disabled}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:whsec_local_disabled}

onesignal:
  rest-api-key: ${ONESIGNAL_REST_API_KEY:local-push-disabled}
  app-id: ${ONESIGNAL_APP_ID:local-push-disabled}

EDGE_WEBHOOK_URL: ${EDGE_WEBHOOK_URL:http://localhost:5000}
